version: "3"
services:
  ####################### mysql #######################
  mysql-5.7:
    image: mysql:5.7
    container_name: mysql-5.7
    restart: always
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/config/my.cnf:/etc/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d/
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=Qq@1178710004...
    ports:
      - "3306:3306"

  phpmyadmin:
    image: "phpmyadmin/phpmyadmin"
    container_name: "phpmyadmin"
    restart: always
    ports:
      - "3307:80"
    environment:
      - PMA_ARBITRARY=1

  ####################### rocket #######################
  rocket-namesrv:
    image: apache/rocketmq:5.1.3
    container_name: rocket-namesrv
    restart: always
    ports:
      - "9876:9876"
    volumes:
      - ./rocket/logs:/home/rocketmq/logs
      - ./rocket/store:/home/rocketmq/store
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -Xms512M -Xmx512M -Xmn128m"
    command: sh mqnamesrv

  rocket-broker:
    image: apache/rocketmq:5.1.3
    container_name: rocket-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./rocket/logs:/home/rocketmq/logs
      - ./rocket/store:/home/rocketmq/store
      - ./rocket/brokerconf/broker.conf:/etc/rocketmq/broker.conf
      - ./rocket/brokerconf/plain_acl.yml:/home/rocketmq/rocketmq-5.1.3/conf/plain_acl.yml
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: "rocket-namesrv:9876"
      JAVA_OPTS: "-Duser.home=/opt"
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -Xms512M -Xmx512M -Xmn128m"
    command: sh mqbroker -c /etc/rocketmq/broker.conf

  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocket-console
    restart: always
    ports:
      - "8180:8080"
    volumes:
      - ./rocket/console:/tmp/rocketmq-console/data
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocket-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false -Drocketmq.config.isAuthenticationEnabled=true -Drocketmq.config.brokerAddresses=rocket-broker:10911 -Drocketmq.config.accessKey=rocketmq -Drocketmq.config.secretKey=Qq@1178710004... -Drocketmq.config.loginRequired=true -Drocketmq.config.dataPath=/tmp/rocketmq-console/data

  ############################# redis #############################
  redis:
    image: redis:6
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
    volumes:
      # 配置文件
      - ./redis/conf/redis.conf:/usr/local/redis.conf
      # 数据文件
      - ./redis/data:/data
    command: [ "redis-server","/usr/local/redis.conf" ]

  ######################### sinking-consul ############################
  sinking-consul:
    image: sinkingcloud/sinking-consul:latest
    container_name: sinking-consul
    restart: always
    ports:
      - "1817:1817"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./sinking/sinking-consul/config/:/data/sinking-consul/config/

  ######################### 前端环境 ############################
  node:
    image: node:16.14.0
    container_name: node
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ../cloud-web/:/data/
    command: tail -F anything

  ################### sinking-cloud服务组(单机可使用容器名做注册地址,集群则注册地址必须使用外网IP) ############################
  service-gateway:
    image: sinkingcloud/service-gateway:latest
    container_name: service-gateway
    restart: always
    ports:
      - "1000:1000"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
      - APP_ADDR=service-gateway
      - APP_PORT=1000
      - APP_REGISTER_SERVER=222.187.238.201:1817
      - APP_REGISTER_TOKEN_KEY=sinking-server-token
      - APP_REGISTER_TOKEN_VALUE=97cb316ec237b3937307d94c38d21785
    volumes:
      - ./sinking/service-gateway/config/:/data/sinking/config/

  service-auth:
    image: sinkingcloud/service-auth:latest
    container_name: service-auth
    restart: always
    ports:
      - "1003:1003"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
      - APP_ADDR=service-auth
      - APP_PORT=1003
      - APP_REGISTER_SERVER=222.187.238.201:1817
      - APP_REGISTER_TOKEN_KEY=sinking-server-token
      - APP_REGISTER_TOKEN_VALUE=97cb316ec237b3937307d94c38d21785
    volumes:
      - ./sinking/service-auth/config/:/data/sinking/config/

  service-websocket:
    image: sinkingcloud/service-websocket:latest
    container_name: service-websocket
    restart: always
    ports:
      - "1005:1005"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
      - APP_ADDR=service-websocket
      - APP_PORT=1005
      - APP_REGISTER_SERVER=222.187.238.201:1817
      - APP_REGISTER_TOKEN_KEY=sinking-server-token
      - APP_REGISTER_TOKEN_VALUE=97cb316ec237b3937307d94c38d21785
    volumes:
      - ./sinking/service-websocket/config/:/data/sinking/config/

  service-user:
    image: sinkingcloud/service-user:latest
    container_name: service-user
    restart: always
    ports:
      - "1002:1002"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
      - APP_ADDR=service-user
      - APP_PORT=1002
      - APP_REGISTER_SERVER=222.187.238.201:1817
      - APP_REGISTER_TOKEN_KEY=sinking-server-token
      - APP_REGISTER_TOKEN_VALUE=97cb316ec237b3937307d94c38d21785
    volumes:
      - ./sinking/service-user/config/:/data/sinking/config/

  service-admin:
    image: sinkingcloud/service-admin:latest
    container_name: service-admin
    restart: always
    ports:
      - "1001:1001"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
      - APP_ADDR=service-admin
      - APP_PORT=1001
      - APP_REGISTER_SERVER=222.187.238.201:1817
      - APP_REGISTER_TOKEN_KEY=sinking-server-token
      - APP_REGISTER_TOKEN_VALUE=97cb316ec237b3937307d94c38d21785
    volumes:
      - ./sinking/service-admin/config/:/data/sinking/config/

  service-open:
    image: sinkingcloud/service-open:latest
    container_name: service-open
    restart: always
    ports:
      - "1004:1004"
    environment:
      - TZ=Asia/Shanghai
      - ROCKETMQ_GO_LOG_LEVEL=error
