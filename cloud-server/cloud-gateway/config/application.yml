#项目信息
project:
  name: cloud-server #项目名称
  env: dev #项目环境

#应用信息
application:
  name: cloud-gateway #应用标识
  group: cloud-common #服务分组
  addr: 127.0.0.1 #应用地址
  port: 1000 #应用端口
  timeout:
    read: 60 #超时读(s)
    write: 60 #超时读(写)
  useService:
    cloud-service:
      - service-admin #引用后台服务
      - service-user #引用用户服务

#注册中心
register:
  server: 42.157.128.40:1817 #注册中心地址
  tokenKey: sinking-token #通信token名
  tokenValue: 97cb316ec237b3937307d94c38d21785 #通信token值
