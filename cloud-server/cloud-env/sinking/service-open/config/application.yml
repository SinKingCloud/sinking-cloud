#项目信息
project:
  name: cloud-server #项目名称
  env: release #项目环境

#应用信息
application:
  name: service-open #应用标识
  group: cloud-service #服务分组
  addr: 127.0.0.1 #应用地址
  port: 1004 #应用端口
  timeout:
    read: 60 #超时读(s)
    write: 60 #超时写(s)
  useService:
    cloud-service:
      - service-user #引用用户服务
      - service-admin #引用后台服务

#注册中心
register:
  server: 111.180.205.222:1817 #注册中心地址
  tokenKey: sinking-server-token #通信token名
  tokenValue: 97cb316ec237b3937307d94c38d21785 #通信token值
