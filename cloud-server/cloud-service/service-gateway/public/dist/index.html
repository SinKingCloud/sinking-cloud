<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>
        SinKingCloud - NetWork Service
    </title>
    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            display: table;
            font-weight: 100;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background-size: 400% 400%;
        }

        /* 暗色模式样式 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: rgba(0, 0, 0, 0.9) !important;
            }

            .title {
                color: white;
            }

            p {
                color: white;
            }
        }

        /* 亮色模式样式 */
        @media (prefers-color-scheme: light) {
            body {
                background-color: rgba(0, 0, 0, 0.1) !important;
            }

            .title {
                color: black;
            }

            p {
                color: black;
            }
        }

        a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: smaller;
        }

        p {
            margin: 15px;
        }

        .container {
            text-align: center;
            display: table-cell;
            vertical-align: middle;
            font-weight: bold;
        }

        .content {
            text-align: center;
            display: inline-block;
        }

        .title {
            font-size: 96px;
        }

        .footer {
            display: table-footer-group;
            text-align: center;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <div class="title">
            All Right Reserved
        </div>
    </div>
</div>
<div class="footer">
    <p>
        © 2026 All Right Reserved
    </p>
</div>
</body>
</html>
