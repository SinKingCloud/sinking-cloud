#项目信息
project:
  name: cloud-server #项目名称
  env: dev #项目环境

#应用信息
application:
  name: service-spider #应用标识
  group: cloud-service #服务分组
  addr: 127.0.0.1 #应用地址
  port: 1006 #应用端口
  timeout:
    read: 60 #超时读(s)
    write: 60 #超时写(s)
  useService: #填写则拉取固定服务,不填写则拉取全部服务

#注册中心
register:
  server: 111.180.205.222:1817 #注册中心地址
  tokenKey: sinking-server-token #通信token名
  tokenValue: 97cb316ec237b3937307d94c38d21785 #通信token值
