#项目信息
project:
  name: cloud-server #项目名称
  env: dev #项目环境

#应用信息
application:
  name: service-spider #应用标识
  group: cloud-service #服务分组
  addr: 127.0.0.1 #应用地址
  port: 1004 #应用端口
  timeout:
    read: 60 #超时读(s)
    write: 60 #超时写(s)
  useService:
    cloud-common:

#爬虫配置
spider:
  httpsProxy: http://tiqu.pyhttp.taolop.com/getip?count=20&neek=20556&type=1&yys=0&port=2&sb=&mr=2&sep=1&pack=14441 #提取代理地址
  maxFailNum: 100 #最大连续抓取失败次数
  tianYanCha:
    threadNum: 10 #天眼查爬虫线程
  fengNiao:
    threadNum: 1 #风鸟爬虫线程
  qiYouCha:
    threadNum: 1 #企友查线程
    token: demotoken #企友查token
  qiChaCha:
    threadNum: 1 #企查查线程
    token: demotoken #企查查token

#注册中心
register:
  server: 203.135.100.55:1817 #注册中心地址
  tokenKey: sinking-server-token #通信token名
  tokenValue: 97cb316ec237b3937307d94c38d21785 #通信token值
